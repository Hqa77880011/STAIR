[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stair"
version = "0.1.0"
description = "STAIR implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "torch>=2.4,<3", "torchvision>=0.19,<1"]

[project.optional-dependencies]
native = ["cvxpy==1.6.5", "clarabel>=0.9,<1", "networkx>=3,<4", "seaborn>=0.12,<1"]

[project.scripts]
stair-report = "stair.common:report"
stair = "stair.cli:main"
stair-native = "stair.native:main"

[tool.setuptools.packages.find]
where = ["src"]
